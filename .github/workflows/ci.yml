name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}
      # Older Python images bundle outdated packaging tools with known CVEs; update them first.
      - run: python -m pip install --upgrade pip setuptools
      - run: pip install -e ".[dev]"
      - run: ruff check . && ruff format --check .
      - name: Type check (mypy)
        run: mypy --ignore-missing-imports src
      - name: Tests with coverage (fails under 80%)
        run: pytest -q --cov=bugreport --cov-report=term-missing --cov-fail-under=80
      - name: Dependency vulnerability audit
        run: pip-audit --skip-editable
      - name: Demo (scripted model, no GPU)
        run: |
          bugreport "the discount thing is broken on my phone" --provider fake \
            --answers examples/answers.json --issues examples/issues.json --md demo.md
          cat demo.md >> "$GITHUB_STEP_SUMMARY"
