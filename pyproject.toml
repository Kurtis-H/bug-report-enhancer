[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "bug-report-enhancer"
version = "0.1.0"
description = "Turn vague bug reports into ones a developer can act on - with redaction, grounding checks and duplicate detection."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = ["httpx>=0.27"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6", "pytest-cov>=5", "mypy>=1.10", "pip-audit>=2.7"]

[project.scripts]
bugreport = "bugreport.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501"]
"src/bugreport/cli.py" = ["E501"]
